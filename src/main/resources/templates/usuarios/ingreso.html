<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Vuelta al Tablero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}">
</head>

<body>
<header th:replace="fragments/header :: header-nav"> </header>

<main class="container container-form">
    <h1>Ingresar</h1>

    <p class="alerta alerta-ok" th:if="${mensajeExito}" th:text="${mensajeExito}">Mensaje</p>
    <p class="alerta alerta-error" th:if="${param.error}">Correo o contraseña incorrectos.</p>

    <!-- Los nombres "correo" y "contrasenia" deben coincidir con SecurityConfig -->
    <form th:action="@{/usuario/ingreso}" method="post">

        <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" maxlength="100" required>
        </div>

        <div class="campo">
            <label for="contrasenia">Contraseña</label>
            <input type="password" id="contrasenia" name="contrasenia" maxlength="72" required>
        </div>

        <button type="submit" class="btn"> Entrar </button>
    </form>

    <p>¿No tenés cuenta, o la diste de baja? <a th:href="@{/registro}">Registrate</a>.
    Si te das de baja y volvés con el mismo correo y DNI, recuperás tu cuenta.</p>
</main>

<footer th:replace="fragments/footer :: footer-nav"> </footer>
</body>

</html>
