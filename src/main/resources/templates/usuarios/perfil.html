<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil | Vuelta al Tablero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}">
</head>

<body>
<header th:replace="fragments/header :: header-nav"> </header>

<main class="container container-form">
    <h1>Mi perfil</h1>

    <p class="alerta alerta-ok" th:if="${mensajeExito}" th:text="${mensajeExito}">Mensaje</p>

    <dl class="datos-perfil">
        <div class="dato">
            <dt>Nombre</dt>
            <dd th:text="${perfil.nombre}">Nombre</dd>
        </div>
        <div class="dato">
            <dt>Apellido</dt>
            <dd th:text="${perfil.apellido}">Apellido</dd>
        </div>
        <div class="dato">
            <dt>DNI</dt>
            <dd th:text="${perfil.dni}">DNI</dd>
        </div>
        <div class="dato">
            <dt>Correo electrónico</dt>
            <dd th:text="${perfil.correo}">correo@ejemplo.com</dd>
        </div>
        <div class="dato">
            <dt>Teléfono</dt>
            <dd th:text="${perfil.telefono}">Teléfono</dd>
        </div>
        <div class="dato">
            <dt>Miembro desde</dt>
            <dd th:text="${#temporals.format(perfil.fechaRegistro, 'dd/MM/yyyy')}">01/01/2026</dd>
        </div>
        <div class="dato">
            <dt>Tipo de cuenta</dt>
            <dd th:text="${perfil.rol}">Usuario</dd>
        </div>
    </dl>

    <div class="acciones-perfil">
        <a th:href="@{/usuario/editar}" class="btn">Modificar datos</a>

        <form th:action="@{/usuario/eliminar}" method="post"
              onsubmit="return confirm('¿Seguro que querés eliminar tu cuenta? Vas a dejar de poder ingresar con ella.');">
            <button type="submit" class="btn btn-peligro">Eliminar cuenta</button>
        </form>
    </div>
</main>

<footer th:replace="fragments/footer :: footer-nav"> </footer>
</body>

</html>
