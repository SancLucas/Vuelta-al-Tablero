<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header-nav">
    <a th:href="@{/}">
        <img th:src="@{/images/logo.png}" alt="Logo de Vuelta al Tablero">
    </a>
    
    <nav>
    <ul>
        <li><a th:href="@{/}">Inicio</a></li>
        <li><a th:href="@{/juegos}">Juegos</a></li>
        <li><a th:href="@{/ejemplares}">Ejemplares</a></li>
        
        <!-- Opciones si NO hay sesión activa -->
        <li th:unless="${sesionIniciada}">
            <a th:href="@{/usuario/ingreso}">Iniciar Sesión</a>
        </li>
        <li th:unless="${sesionIniciada}">
            <a th:href="@{/registro}">Registrarse</a>
        </li>

        <!-- Opciones si SÍ hay sesión activa -->
        <li th:if="${sesionIniciada}">
            <a th:href="@{/usuario/perfil}">Mi Perfil</a>
        </li>
        <li th:if="${sesionIniciada}">
            <!-- Spring Security exige POST (con token CSRF) para cerrar sesión -->
            <form th:action="@{/salir}" method="post" class="form-salir">
                <button type="submit" class="enlace-nav">Cerrar Sesión</button>
            </form>
        </li>
    </ul>
</nav>
</header>
</html>
