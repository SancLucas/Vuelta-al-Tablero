<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header class="encabezado" th:fragment="header-nav">
    <a class="encabezado-logo" th:href="@{/}">
        <img th:src="@{/images/logo.png}" width="330" height="264" alt="Vuelta al Tablero, ir al inicio">
    </a>

    <!-- Solo se ve en pantallas chicas (ver style.css y js/menu-movil.js) -->
    <button type="button" class="menu-boton" aria-expanded="false" aria-controls="menu-principal">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
            <g class="icono-abrir"><path d="M4 7h16M4 12h16M4 17h16"/></g>
            <g class="icono-cerrar"><path d="M6 6l12 12M18 6L6 18"/></g>
        </svg>
        <span class="menu-boton-texto">Menú</span>
    </button>

    <nav class="encabezado-nav" id="menu-principal" aria-label="Principal">
        <ul class="menu">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/juegos}">Catálogo</a></li>
            <li><a th:href="@{/ejemplares}">Ejemplares</a></li>

            <!-- Opciones si SÍ hay sesión activa -->
            <li th:if="${sesionIniciada}"><a th:href="@{/mis-ejemplares}">Mis ejemplares</a></li>
            <li th:if="${sesionIniciada}"><a th:href="@{/mis-alquileres}">Mis alquileres</a></li>
            <li th:if="${sesionIniciada}"><a th:href="@{/usuario/perfil}">Mi perfil</a></li>
            <li th:if="${esAdmin}"><a th:href="@{/usuarios}">Usuarios</a></li>
        </ul>

        <div class="encabezado-acciones">
            <!-- Opciones si NO hay sesión activa -->
            <a class="enlace-nav" th:unless="${sesionIniciada}" th:href="@{/usuario/ingreso}">Iniciar sesión</a>
            <a class="btn" th:unless="${sesionIniciada}" th:href="@{/registro}">Unirse</a>

            <!-- Spring Security exige POST (con token CSRF) para cerrar sesión -->
            <form class="form-salir" th:if="${sesionIniciada}" th:action="@{/salir}" method="post">
                <button type="submit" class="btn btn-secundario">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <script th:src="@{/js/menu-movil.js}"></script>
</header>
</html>
