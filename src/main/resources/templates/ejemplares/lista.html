<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplares disponibles | Vuelta al Tablero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}">
</head>

<body>
<header th:replace="fragments/header :: header-nav"> </header>

<main class="container">
    <div class="encabezado-lista">
        <h1>Ejemplares para alquilar</h1>
        <a th:if="${sesionIniciada}" th:href="@{/mis-ejemplares/nuevo}" class="btn btn-compacto">Publicar el mío</a>
    </div>

    <p class="vacio" th:if="${#lists.isEmpty(ejemplares)}">
        Por ahora no hay ejemplares disponibles para alquilar.
        <span th:unless="${sesionIniciada}">
            <a th:href="@{/usuario/ingreso}">Ingresá</a> para publicar uno de los tuyos.
        </span>
    </p>

    <ul class="tarjetas">
        <li class="tarjeta" th:each="ejemplar : ${ejemplares}">
            <h2><a th:href="@{/ejemplares/{id}(id=${ejemplar.id})}" th:text="${ejemplar.tituloJuego}">Juego</a></h2>
            <p class="tarjeta-detalle" th:text="'Estado: ' + ${ejemplar.estado.etiqueta}">Estado: Nuevo</p>
            <p class="tarjeta-detalle" th:text="'Lo ofrece ' + ${ejemplar.propietario}">Lo ofrece Ana</p>
            <p class="tarjeta-detalle"
               th:text="'$ ' + ${#numbers.formatDecimal(ejemplar.precioPorDia, 1, 'POINT', 2, 'COMMA')} + ' por día'">$ 1.000,00 por día</p>

            <div class="tarjeta-acciones">
                <a th:href="@{/ejemplares/{id}(id=${ejemplar.id})}" class="btn btn-compacto">Ver ejemplar</a>
                <a th:href="@{/juegos/{id}(id=${ejemplar.idJuego})}" class="btn btn-compacto btn-secundario">Ver juego</a>
            </div>
        </li>
    </ul>
</main>

<footer th:replace="fragments/footer :: footer-nav"> </footer>
</body>

</html>
